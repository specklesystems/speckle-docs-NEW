# Makes this sample its own pnpm root. Without it, pnpm walks up to the docs
# repo's pnpm-workspace.yaml and installs into that store, so a `pnpm install`
# at the docs root then prunes the sample's dependencies out from under it.
packages: []

# @speckle/shared declares server-side peers (knex, bull, pino, tiptap, ...) that a
# browser app never loads; auto-installing them only adds unused, flagged code.
# zod is the one peer the browser bundle imports, so package.json lists it directly.
autoInstallPeers: false

# esbuild (via vite) needs its install script to fetch its platform binary.
allowBuilds:
  esbuild: true
