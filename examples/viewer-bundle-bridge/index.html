<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speckle bundle bridge</title>
    <style>
      body {
        margin: 0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        display: grid;
        grid-template-columns: 320px 1fr;
        height: 100vh;
      }
      aside {
        padding: 16px;
        overflow: auto;
        border-right: 1px solid #ddd;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
      }
      button {
        padding: 8px 12px;
      }
      pre {
        white-space: pre-wrap;
        background: #f6f6f6;
        padding: 8px;
      }
      #viewer {
        position: relative;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>Bundle bridge</h1>
      <form id="load-form">
        <label>Server URL <input name="serverUrl" value="https://app.speckle.systems" /></label>
        <label>Project id <input name="projectId" /></label>
        <label>Model id <input name="modelId" /></label>
        <label>Version id <input name="versionId" /></label>
        <label>Personal access token <input name="token" type="password" /></label>
        <button type="submit">Load</button>
      </form>
      <pre id="status"></pre>
    </aside>
    <div id="viewer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
