[tools]
node = "22.17.1"
pnpm = "10.30.3"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the Mintlify dev server (port 3333)"
run = "pnpm run dev"

[tasks.validate]
description = "Validate the docs (mint validate)"
run = "pnpm run valid"

[tasks.check-links]
description = "Check for broken links and anchors"
run = "pnpm run check-links"

[tasks.example-check]
description = "Typecheck and build the bundle-bridge sample (its own pnpm root)"
dir = "examples/viewer-bundle-bridge"
run = ["pnpm install --frozen-lockfile", "pnpm typecheck", "pnpm build"]

[tasks.technical-changelog-collect]
description = "Collect merge and release evidence for the technical changelog window"
run = "pnpm technical-changelog:collect"

[tasks.technical-changelog-render]
description = "Merge a validated weekly check into its monthly technical changelog"
run = "pnpm technical-changelog:render"

[tasks.technical-changelog-test]
description = "Test the repository-owned technical changelog workflow"
run = "pnpm technical-changelog:test"

# Alias for a session started in this repo alone; the atlas root fan-out runs the script directly (ADR-0008).
[tasks.agents-sync]
description = "Sync agent config (shared atlas set + agents/) into .claude/skills, .agents/skills, .mcp.json, .codex/config.toml"
run = 'python3 "${ATLAS_ROOT:-..}/atlas/scripts/sync-agents.py" --repo .'
