# Dependency cooldown: block packages published in the last 7 days.
# Mitigates supply-chain attacks, which are typically detected within hours/days of publish.
# See https://cooldowns.dev/ — pnpm 10.16+ honors `minimumReleaseAge` (value in minutes; 7d = 10080).
minimumReleaseAge: 10080
overrides:
  '@asyncapi/specs': '6.8.1'
  # Dependabot #124/#163/#204 (sharp), #165 (js-yaml), #202 (katex): no parent release allows the
  # fixed version. mint uses sharp only to resize favicons; markdownlint loads katex but only
  # parses math. Drop each override once its parent allows the fixed version.
  '@mintlify/cli>sharp': '^0.35.5'
  '@mintlify/package-builder>js-yaml': '^4.3.2'
  'micromark-extension-math>katex': '^0.18.2'
