# npm updates arrive as one grouped pull request per directory per week, and
# skip versions younger than the 7-day release cooldown the pnpm workspaces use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /examples/viewer-bundle-bridge
      - /examples/bundle-properties-function/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ['*']
