# npm updates arrive as one grouped pull request per directory per week, and
# skip versions younger than the 7-day release cooldown the pnpm workspaces use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /examples/viewer-bundle-bridge
      - /examples/bundle-properties-function/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ['*']

  # Pin updates of the shared workflows in specklesystems/.github, one pull
  # request per new tag there. The cooldown lets speckle-next take a new pin
  # first (ADR-0002 amendment of 2026-11-24, ENG-11742).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: specklesystems/.github/*
    groups:
      dot-github:
        patterns: ['specklesystems/.github/*']
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
