# npm updates arrive as one grouped pull request per directory per week, and
# skip versions younger than the 7-day release cooldown the pnpm workspaces use.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /examples/viewer-bundle-bridge
      - /examples/bundle-properties-function/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      examples:
        patterns: ['*']

  # Pin updates of the shared workflows in specklesystems/.github, one pull
  # request per new tag there, with no cooldown. Another repo of the org takes a
  # new pin first; this repo merges its update after the changed workflows worked
  # there. The cooldown block applies to nothing here; zizmor asks for it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: specklesystems/.github/*
    groups:
      dot-github:
        patterns: ['specklesystems/.github/*']
    cooldown:
      default-days: 7
      exclude: ['specklesystems/.github/*']
    commit-message:
      prefix: ci
