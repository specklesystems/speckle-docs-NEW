# Phase 2b: validate, broken-links, and format-lint (changed files) are blocking.
# Accessibility stays report-only (Phase 2c).
#
# Branch protection: require "Mintlify validate", "Broken links", and
# "Format and lint" (see scripts/enable-required-pr-checks.sh).

name: Docs PR checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.jsx'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.jsonc'
      - 'docs.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.markdownlint-cli2.jsonc'
      - 'lint-staged.config.mjs'
      - 'scripts/format-check-changed.sh'
      - 'scripts/lint-md-changed.sh'
      - 'scripts/enable-required-pr-checks.sh'
      - '.github/workflows/docs-pr-checks.yml'
      - '.github/workflows/docs-scheduled-checks.yml'

concurrency:
  group: docs-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

jobs:
  format-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check (changed files)
        run: pnpm format:check:changed "$DIFF_RANGE"

      - name: Markdownlint (changed files)
        run: pnpm lint:md:changed "$DIFF_RANGE"

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Format and lint (changed files)'
            echo ''
            echo 'Prettier + markdownlint on files changed in this PR only.'
            echo 'Blocking — required status check after Phase 2b merges.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Mintlify validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mintlify validate
        run: pnpm valid

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Mintlify validate (full site)'
            echo ''
            echo 'Blocking. Require this check in branch protection for `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  broken-links:
    name: Broken links
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check broken links (anchors, redirects, snippets)
        run: pnpm check-links

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Broken links (full site)'
            echo ''
            echo 'Anchors + docs.json redirects + links inside Snippet components.'
            echo 'Blocking. Require this check in branch protection for `main`.'
            echo 'External URLs stay on the scheduled workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mintlify accessibility check
        run: pnpm check:a11y

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Accessibility (full site)'
            echo ''
            echo '`mint a11y` — still report-only (Phase 2c).'
          } >> "$GITHUB_STEP_SUMMARY"
