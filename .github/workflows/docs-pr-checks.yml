# Docs PR checks: Format and lint (changed files), Mintlify validate, Broken
# links, and Accessibility are blocking.
#
# Branch protection: require "Mintlify validate", "Broken links",
# "Format and lint", and "Accessibility" (see scripts/enable-required-pr-checks.sh).

name: Docs PR checks

on:
  pull_request:

concurrency:
  group: docs-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

jobs:
  format-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check (changed files)
        run: pnpm format:check:changed "$DIFF_RANGE"

      - name: Markdownlint (changed files)
        run: pnpm lint:md:changed "$DIFF_RANGE"

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Format and lint (changed files)'
            echo ''
            echo 'Prettier + markdownlint on files changed in this PR only.'
            echo 'Blocking — required status check on `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Mintlify validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mintlify validate
        run: pnpm valid

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Mintlify validate (full site)'
            echo ''
            echo 'Blocking. Require this check in branch protection for `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  broken-links:
    name: Broken links
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check broken links (anchors, redirects, snippets)
        run: pnpm check-links

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Broken links (full site)'
            echo ''
            echo 'Anchors + docs.json redirects + links inside Snippet components.'
            echo 'Blocking. Require this check in branch protection for `main`.'
            echo 'External URLs stay on the scheduled workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  structure:
    name: Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Redirect integrity
        run: node scripts/check-redirects.mjs

      - name: Orphan pages
        if: always()
        run: node scripts/check-orphans.mjs

      - name: Local assets
        if: always()
        run: node scripts/check-assets.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Structure'
            echo ''
            echo '### Redirect integrity'
            echo ''
            echo 'Catches what `--check-redirects` does not: a redirect *source*'
            echo 'that shadows a live page. Redirects win over pages, so a stray'
            echo 'wildcard silently makes real docs unreachable.'
            echo ''
            echo 'Also checks unknown keys, duplicates, self-redirects, chains,'
            echo 'and destinations that resolve to nothing.'
            echo ''
            echo '### Orphan pages'
            echo ''
            echo 'Pages that exist but are not reachable from navigation.'
            echo 'Deliberately unlisted pages belong in'
            echo '`scripts/orphan-allowlist.txt` with a reason.'
            echo ''
            echo '### Local assets'
            echo ''
            echo 'Images and downloads referenced by a page must exist in the'
            echo 'repo. A stale reference can still render in production from a'
            echo 'CDN copy left by an earlier build, so this will not show up'
            echo 'as a broken image on the live site.'
            echo ''
            echo 'No install step — plain Node, runs in seconds.'
          } >> "$GITHUB_STEP_SUMMARY"

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mintlify accessibility check
        run: pnpm check:a11y

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Accessibility (full site)'
            echo ''
            echo '`mint a11y` — blocking; required status check on `main`.'
          } >> "$GITHUB_STEP_SUMMARY"
