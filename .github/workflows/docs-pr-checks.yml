# Docs PR checks: Format and lint (changed files), Mintlify validate, Broken
# links, Missing assets, Structure, and Accessibility are blocking.
#
# Image placeholders is informational: catalogues IMAGE_PLACEHOLDER comments
# (outstanding screenshots). Always green. Not a required check.
#
# Broken links and Missing assets are deliberately separate: `mint broken-links`
# checks page links, while Missing assets checks local image and download files,
# which it does not cover.
#
# Branch protection: require "Mintlify validate", "Broken links",
# "Format and lint", "Missing assets", "Structure", and "Accessibility"
# (see scripts/enable-required-pr-checks.sh).

name: Docs PR checks

on:
  pull_request:

concurrency:
  group: docs-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

jobs:
  format-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check (changed files)
        run: pnpm format:check:changed "$DIFF_RANGE"

      - name: Markdownlint (changed files)
        run: pnpm lint:md:changed "$DIFF_RANGE"

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Format and lint (changed files)'
            echo ''
            echo 'Prettier + markdownlint on files changed in this PR only.'
            echo 'Blocking — required status check on `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Mintlify validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mintlify validate
        run: pnpm valid

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Mintlify validate (full site)'
            echo ''
            echo 'Blocking. Require this check in branch protection for `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  broken-links:
    name: Broken links
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check broken links (anchors, redirects, snippets)
        run: pnpm check-links

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Broken links (full site)'
            echo ''
            echo 'Anchors + docs.json redirects + links inside Snippet components.'
            echo 'Blocking. Require this check in branch protection for `main`.'
            echo 'External URLs stay on the scheduled workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

  missing-assets:
    name: Missing assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Check local assets
        run: node scripts/check-assets.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Missing assets'
            echo ''
            echo 'Images and downloads referenced by a page must exist in the repo.'
            echo ''
            echo 'Separate from Broken links: `mint broken-links` checks page'
            echo 'links, not local asset files. A stale asset reference can still'
            echo 'render in production from a CDN copy left by an earlier build,'
            echo 'so it never shows as a broken image on the live site.'
            echo ''
            echo 'No install step — plain Node, runs in seconds.'
          } >> "$GITHUB_STEP_SUMMARY"

  structure:
    name: Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Redirect integrity
        run: node scripts/check-redirects.mjs

      - name: Orphan pages
        if: always()
        run: node scripts/check-orphans.mjs

      - name: Image framing
        if: always()
        run: node scripts/check-frames.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Structure'
            echo ''
            echo '### Redirect integrity'
            echo ''
            echo 'Catches what `--check-redirects` does not: a redirect *source*'
            echo 'that shadows a live page. Redirects win over pages, so a stray'
            echo 'wildcard silently makes real docs unreachable.'
            echo ''
            echo 'Also checks unknown keys, duplicates, self-redirects, chains,'
            echo 'and destinations that resolve to nothing.'
            echo ''
            echo '### Orphan pages'
            echo ''
            echo 'Pages that exist but are not reachable from navigation.'
            echo 'Deliberately unlisted pages belong in'
            echo '`scripts/orphan-allowlist.txt` with a reason.'
            echo ''
            echo '### Image framing'
            echo ''
            echo 'Screenshots, diagrams, and videos belong inside a `<Frame>`.'
            echo 'Exemptions go in `scripts/frame-allowlist.txt`.'
            echo '`legacy/` is skipped as frozen historical content.'
            echo ''
            echo 'No install step — plain Node, runs in seconds.'
          } >> "$GITHUB_STEP_SUMMARY"

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mintlify accessibility check
        run: pnpm check:a11y

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Accessibility (full site)'
            echo ''
            echo '`mint a11y` — blocking; required status check on `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  image-placeholders:
    name: Image placeholders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Report outstanding screenshots
        run: node scripts/report-image-placeholders.mjs --markdown --annotate
